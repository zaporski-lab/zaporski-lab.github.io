<script>
(function () {
  const host = document.getElementById('hero-animation');
  if (!host) return;

  const canvas = document.createElement('canvas');
  canvas.id = 'bg';
  host.appendChild(canvas);

  const ctx = canvas.getContext('2d');
  let width = 0;
  let height = 0;
  let dpr = window.devicePixelRatio || 1;

  ctx.lineWidth = 1.05;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  let mouse = { x: 0, y: 0 };

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  window.addEventListener('touchmove', (e) => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  });

  const symbols = [];
  const spacing = 84;

  function buildGrid() {
    symbols.length = 0;
    const offsetX = (width % spacing) / 2;
    const offsetY = (height % spacing) / 2;
    const safeHeight = height + spacing;
    const safeWidth = width + spacing;

    for (let x = offsetX; x < safeWidth; x += spacing) {
      for (let y = offsetY; y < safeHeight; y += spacing) {
        symbols.push({ x, y });
      }
    }
  }

  function resize() {
    width = host.clientWidth || window.innerWidth;
    height = host.clientHeight || 360;

    dpr = window.devicePixelRatio || 1;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    ctx.lineWidth = 1.05;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (!mouse.x && !mouse.y) {
      mouse.x = width / 2;
      mouse.y = height / 2;
    }

    buildGrid();
    drawFrame();
  }

  window.addEventListener('resize', resize);

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function mix(c1, c2, t) {
    return {
      r: Math.round(lerp(c1.r, c2.r, t)),
      g: Math.round(lerp(c1.g, c2.g, t)),
      b: Math.round(lerp(c1.b, c2.b, t))
    };
  }

  function getColor(dist, maxDist) {
    const t = Math.max(0, Math.min(1, 1 - dist / maxDist));
    const far = { r: 68, g: 71, b: 77 };
    const near = { r: 245, g: 245, b: 245 };
    const accent = { r: 217, g: 95, b: 2 };

    let c = mix(far, near, t * t);
    if (t > 0.82) {
      c = mix(c, accent, (t - 0.82) / 0.18);
    }

    return { css: `rgb(${c.r},${c.g},${c.b})`, strength: t };
  }

  function drawSymbol(x, y, angle, color, strength) {
    const r = 15;
    const lineLen = 10;

    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = color;
    ctx.shadowBlur = 2 + 10 * strength;

    ctx.beginPath();
    ctx.arc(0, 0, r, Math.PI, 0);
    ctx.strokeStyle = color;
    ctx.stroke();

    let dx = Math.cos(angle);
    let dy = Math.sin(angle);

    if (dy > 0) {
      dx = -dx;
      dy = -dy;
    }

    const len = Math.hypot(dx, dy);
    dx /= len;
    dy /= len;

    const endX = dx * (r + lineLen);
    const endY = dy * (r + lineLen);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    const arrowSize = 3.5;
    const px = -dy;
    const py = dx;

    ctx.beginPath();
    ctx.moveTo(endX, endY);
    ctx.lineTo(
      endX - dx * arrowSize + px * arrowSize * 0.6,
      endY - dy * arrowSize + py * arrowSize * 0.6
    );
    ctx.lineTo(
      endX - dx * arrowSize - px * arrowSize * 0.6,
      endY - dy * arrowSize - py * arrowSize * 0.6
    );
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, 1.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawFrame() {
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(0, 0, width, height);

    const gradient = ctx.createRadialGradient(
      width / 2,
      height * 0.35,
      100,
      width / 2,
      height / 2,
      width
    );

    gradient.addColorStop(0, 'rgba(255,255,255,0.03)');
    gradient.addColorStop(1, 'rgba(0,0,0,0.25)');

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    const maxDist = 700;
    for (const s of symbols) {
      const dx = mouse.x - s.x;
      const dy = mouse.y - s.y;
      const dist = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);
      const c = getColor(dist, maxDist);
      ctx.globalAlpha = 0.22 + 0.78 * Math.pow(c.strength, 2);
      drawSymbol(s.x, s.y, angle, c.css, c.strength);
    }

    ctx.globalAlpha = 1;
  }

  function animate() {
    drawFrame();
    requestAnimationFrame(animate);
  }

  requestAnimationFrame(() => {
    resize();
    animate();
  });
})();
</script>
